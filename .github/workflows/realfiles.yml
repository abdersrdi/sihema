name: Real files

# Opens each program in corpus/ on an iPhone simulator, on the path tab and on the simulated report, and keeps
# screenshots. Started by hand.

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: iPhone
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          devs = [d for runtime, ds in sorted(data.items()) if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')]
          print(devs[-1]['udid'])
          ")
          TEST_RUNNER_CORPUS_DIR="$PWD/corpus" xcodebuild test \
            -project Sihema.xcodeproj \
            -scheme Sihema-iOS \
            -destination "id=$UDID" \
            -only-testing:SihemaiOSUITests/RealFileTests \
            -resultBundlePath Result-iphone.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ui-iphone.log

      - name: Export the screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments --path Result-iphone.xcresult --output-path exported-iphone || true
          python3 tools/export_shots.py exported-iphone shots/iphone || true
          find shots -type f | sort || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realfiles
          path: |
            shots
            ui-*.log
