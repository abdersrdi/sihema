name: Screenshots

# Launches the app on each tab with a sample program, on a Mac and then on an iPhone and an iPad simulator, and keeps
# a screenshot of every tab. One job, run in turn, because macOS runners are scarce. Started by hand.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "mac, iphone, ipad or all"
        default: "all"

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Mac
        if: inputs.platforms == 'all' || inputs.platforms == 'mac'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project Sihema.xcodeproj \
            -scheme Sihema-macOS \
            -destination 'platform=macOS' \
            -resultBundlePath Result-mac.xcresult \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee ui-mac.log

      - name: Mac launch diagnostics
        if: inputs.platforms == 'macdiag'
        continue-on-error: true
        run: |
          mkdir -p diag
          xcodebuild build \
            -project Sihema.xcodeproj \
            -scheme Sihema-macOS \
            -destination 'platform=macOS' \
            -derivedDataPath dd \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            2>&1 | tail -5
          APP=$(find "$PWD/dd" -name Sihema.app -maxdepth 6 | head -1)
          echo "app: $APP" | tee diag/info.txt
          codesign -dv --entitlements - "$APP" >> diag/info.txt 2>&1 || true
          # with the test switches
          open -a "$APP" --args -UITestDirect -UITestTab code
          sleep 10
          screencapture -x diag/direct.png || true
          osascript -e 'tell application "System Events" to get name of every window of process "Sihema"' > diag/windows-direct.txt 2>&1 || true
          log show --last 2m --predicate 'process == "Sihema"' --style compact > diag/log-direct.txt 2>&1 || true
          pkill -x Sihema || true
          sleep 3
          # plain launch, as a user would
          open -a "$APP"
          sleep 10
          screencapture -x diag/normal.png || true
          osascript -e 'tell application "System Events" to get name of every window of process "Sihema"' > diag/windows-normal.txt 2>&1 || true
          log show --last 2m --predicate 'process == "Sihema"' --style compact > diag/log-normal.txt 2>&1 || true
          pkill -x Sihema || true
          ls -la ~/Library/Logs/DiagnosticReports > diag/crashes.txt 2>&1 || true

      - name: iPhone
        if: inputs.platforms == 'all' || inputs.platforms == 'iphone'
        continue-on-error: true
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          devs = [d for runtime, ds in sorted(data.items()) if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')]
          print(devs[-1]['udid'])
          ")
          xcodebuild test \
            -project Sihema.xcodeproj \
            -scheme Sihema-iOS \
            -destination "id=$UDID" \
            -resultBundlePath Result-iphone.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ui-iphone.log

      - name: iPad
        if: inputs.platforms == 'all' || inputs.platforms == 'ipad'
        continue-on-error: true
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          devs = [d for runtime, ds in sorted(data.items()) if 'iOS' in runtime for d in ds if d['name'].startswith('iPad')]
          print(devs[-1]['udid'])
          ")
          xcodebuild test \
            -project Sihema.xcodeproj \
            -scheme Sihema-iOS \
            -destination "id=$UDID" \
            -resultBundlePath Result-ipad.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ui-ipad.log

      - name: Export the screenshots
        if: always()
        run: |
          rm -rf shots
          for name in mac iphone ipad; do
            rm -rf exported-$name
            xcrun xcresulttool export attachments --path Result-$name.xcresult --output-path exported-$name || true
            python3 tools/export_shots.py exported-$name shots/$name || true
          done
          find shots -type f | sort || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            shots
            diag
            ui-*.log
