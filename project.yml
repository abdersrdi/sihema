name: Sihema

options:
  bundleIdPrefix: com.sihema
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

packages:
  SihemaCore:
    path: .

targets:
  Sihema-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
    dependencies:
      - package: SihemaCore
        product: SihemaCore
    settings:
      base:
        # Phase 0 spike identifiers. The final bundle ID is decided before the App Store record is created.
        PRODUCT_BUNDLE_IDENTIFIER: com.sihema.app
        PRODUCT_NAME: Sihema
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/macOS/Sihema.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Sihema
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: G-code program
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.data

  SihemaMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - App/UITests
    dependencies:
      - target: Sihema-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sihema.app.uitests
        GENERATE_INFOPLIST_FILE: YES

  SihemaiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: Sihema-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sihema.app.uitests
        GENERATE_INFOPLIST_FILE: YES

  Sihema-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
    dependencies:
      - package: SihemaCore
        product: SihemaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sihema.app
        PRODUCT_NAME: Sihema
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Sihema
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: G-code program
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.data

schemes:
  Sihema-macOS:
    build:
      targets:
        Sihema-macOS: all
    test:
      targets:
        - SihemaMacUITests
  Sihema-iOS:
    build:
      targets:
        Sihema-iOS: all
    test:
      targets:
        - SihemaiOSUITests
